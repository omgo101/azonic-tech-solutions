<!-- header.html -->
<header id="site-header" class="fixed-top">
  <!-- Embedded Header CSS -->
  <style>
    /* ========== HEADER STYLES ========== */
    #site-header {
      background: rgba(10, 15, 30, 0.9);
      backdrop-filter: blur(12px);
      padding: 12px 0;
      transition: 0.3s;
      z-index: 999;
      border-bottom: 2px solid #00b4d8;
    }
    .header-logo {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
      text-decoration: none;
      letter-spacing: 1px;
    }
    .header-logo span {
      color: #00b4d8;
    }
    .nav-menu ul {
      list-style: none;
      display: flex;
      margin: 0;
      padding: 0;
    }
    .nav-menu li {
      margin-left: 25px;
    }
    .nav-menu a {
      color: #fff;
      text-decoration: none;
      font-weight: 500;
      transition: 0.3s;
      position: relative;
    }
    .nav-menu a:hover,
    .nav-menu a.active {
      color: #00b4d8;
    }
    .nav-menu a.active::after {
      content: '';
      position: absolute;
      bottom: -5px;
      left: 0;
      width: 100%;
      height: 2px;
      background: #00b4d8;
    }
    .header-contact-btn {
      background: #00b4d8;
      color: #fff;
      padding: 8px 20px;
      border-radius: 30px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }
    .header-contact-btn:hover {
      background: #0096c7;
      color: #fff;
    }
    /* Mobile */
    @media (max-width: 992px) {
      .nav-menu {
        display: none;
      }
      .mobile-toggle {
        display: block;
        color: #fff;
        font-size: 28px;
        cursor: pointer;
      }
    }
    @media (min-width: 992px) {
      .mobile-toggle {
        display: none;
      }
    }
  </style>

  <div class="container">
    <div class="d-flex justify-content-between align-items-center">
      <!-- Logo -->
      <a href="index.html" class="header-logo">Azonic<span>Tech</span></a>

      <!-- Navigation -->
      <nav class="nav-menu d-none d-lg-flex" id="main-nav">
        <ul>
          <li><a href="#hero" class="active">Home</a></li>
          <li><a href="#services">Services</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>

      <!-- CTA Button -->
      <a href="#contact" class="header-contact-btn d-none d-lg-inline-block">Get a Quote</a>

      <!-- Mobile Toggle -->
      <i class="bi bi-list mobile-toggle" onclick="toggleMobileMenu()"></i>
    </div>
  </div>
</header>

<!-- Mobile menu script (minimal) -->
<script>
  function toggleMobileMenu() {
    const nav = document.getElementById('main-nav');
    nav.style.display = nav.style.display === 'block' ? 'none' : 'block';
  }
</script>
